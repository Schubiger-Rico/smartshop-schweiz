<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartShop Schweiz</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#4e5ff2;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4e5ff2;
    color:white;
    cursor:pointer;
}

.item{
    background:#f1f1f1;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    cursor:pointer;
}

.history{
    background:#fafafa;
    color:#666;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    cursor:pointer;
}

h3{
    margin-top:25px;
}
</style>

</head>
<body>

<div class="container">

<h1>🛒 SmartShop Schweiz</h1>

<input id="produkt" placeholder="Produkt eingeben">
<input
id="menge"
type="number"
value="1"
min="1"
placeholder="Menge">
<select id="einheit">
<option value="">Keine</option>
<option value="Stück">Stück</option>
<option value="g">g</option>
<option value="kg">kg</option>
<option value="Liter">Liter</option>
<option value="Packung">Packung</option>
</select> 
<div id="vorschlaege"></div>
<button onclick="addProduct()">
Produkt hinzufügen
</button>

<h3>Aktuelle Einkaufsliste</h3>
<div id="liste"></div>

<h3>🕓 Zuletzt gekauft</h3>
<div id="history"></div>
<h3>⭐ Häufig gekauft</h3>
<div id="haeufig"></div>
</div>

<script>

let liste =
JSON.parse(localStorage.getItem("liste")) || [];

let historyListe =
JSON.parse(localStorage.getItem("history")) || [];
let gekauft =
JSON.parse(localStorage.getItem("gekauft")) || {};
let standardMengen =
JSON.parse(localStorage.getItem("standardMengen")) || {};

let standardProdukte = [
"Milch",
"Mozzarella",
"Käse",
"Butter",
"Bananen",
"Äpfel",
"Tomaten",
"Eier",
"Cola"
];

let produkte =
JSON.parse(localStorage.getItem("produkte")) ||
standardProdukte;
    
    
let feld =
document.getElementById("produkt");

feld.addEventListener("input",function(){

let suche =
feld.value.toLowerCase();

let treffer =
produkte.filter(p =>
p.toLowerCase().startsWith(suche)
);

let vorschlaege =
document.getElementById("vorschlaege");

vorschlaege.innerHTML="";

if(suche.length<1){
return;
}

treffer.slice(0,5).forEach(function(produkt){

vorschlaege.innerHTML +=
'<div class="history" onclick="waehleProdukt(\''+
produkt+
'\')">'+
produkt+
'</div>';

});

});
function waehleProdukt(produkt){

document.getElementById("produkt").value =
produkt;

document.getElementById("vorschlaege").innerHTML =
"";

}
function speichern(){

localStorage.setItem(
"liste",
JSON.stringify(liste)
);

localStorage.setItem(
"history",
JSON.stringify(historyListe)
);
localStorage.setItem(
"produkte",
JSON.stringify(produkte)
);
localStorage.setItem(
"standardMengen",
JSON.stringify(standardMengen)
);
}

function addProduct(){

let feld =
document.getElementById("produkt");
let menge =
document.getElementById("menge").value;

let einheit =
document.getElementById("einheit").value;

let text =
feld.value.trim();

text =
text.charAt(0).toUpperCase() +
text.slice(1).toLowerCase();
standardMengen[text] = {
    menge: menge,
    einheit: einheit
};    
if(text===""){
return;
}

if(!produkte.includes(text)){
    produkte.push(text);
}

let anzeigeText = text;

if(einheit !== ""){
    anzeigeText =
    text + " (" + menge + " " + einheit + ")";
}

liste.push(anzeigeText);

feld.value="";

speichern();

anzeigen();

}

function erledigt(index){

let produkt = liste[index];
gekauft[produkt] =
(gekauft[produkt] || 0) + 1;
if(!historyListe.includes(produkt)){
    historyListe.unshift(produkt);
}

if(historyListe.length>20){
historyListe.pop();
}

liste.splice(index,1);

speichern();

anzeigen();

}

function erneut(produkt){

if(!liste.includes(produkt)){

liste.push(produkt);

speichern();

anzeigen();

}

}
function loescheHistory(index){

historyListe.splice(index,1);

speichern();

anzeigen();

}

function anzeigen(){

let listeDiv =
document.getElementById("liste");

let historyDiv =
document.getElementById("history");
let haeufigDiv =
document.getElementById("haeufig");
listeDiv.innerHTML="";
historyDiv.innerHTML="";
haeufigDiv.innerHTML="";
for(let i=0;i<liste.length;i++){

listeDiv.innerHTML +=
'<div class="item" onclick="erledigt('+i+')">☐ '
+ liste[i] +
'</div>';

}

for(let i=0;i<historyListe.length;i++){

historyDiv.innerHTML +=
'<div class="history" style="display:flex;justify-content:space-between;">'
+
'<span onclick="erneut(\''+
historyListe[i]+
'\')" style="cursor:pointer;">'
+
historyListe[i]
+
'</span>'
+
'<span onclick="loescheHistory('+i+')" style="color:red;cursor:pointer;">🗑️</span>'
+
'</div>';
let sortiert =
Object.keys(gekauft).sort(
(a,b) => gekauft[b] - gekauft[a]
);

for(let i=0;i<sortiert.length && i<5;i++){

haeufigDiv.innerHTML +=
'<div class="history" onclick="erneut(\''+
sortiert[i]+
'\')">'+
sortiert[i]+
' ('+gekauft[sortiert[i]]+'x)</div>';

}
}

}

anzeigen();

</script>

</body>
</html>
