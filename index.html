<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartShop Schweiz</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:24px;
    box-shadow:0 16px 40px rgba(15,23,42,.12);
}

h1{
    text-align:center;
    color:#0f766e;
    font-size:32px;
}

input{
    width:100%;
    padding:16px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:14px;
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:#0f766e;
    color:white;
    cursor:pointer;
}

.item{
    background:white;
    padding:14px;
    margin-top:10px;
    border-radius:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    cursor:pointer;
}

.history{
    background:#fafafa;
    color:#666;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    cursor:pointer;
}
.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.karte{
    background:white;
    padding:14px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    font-weight:bold;
}
.untertitel{
    text-align:center;
    color:#64748b;
    margin-top:-10px;
    margin-bottom:20px;
    font-size:14px;
} 
.eingabeKarte{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-top:15px;
    margin-bottom:25px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}
 .mengenZeile{
    display:flex;
    gap:10px;
    margin-top:10px;
}
.mengenZeile input{
    flex:1;
}

.mengenZeile select{
    flex:2;

}   
h3{
    margin-top:25px;
    color:#0f766e;
    border-bottom:2px solid #e2e8f0;
    padding-bottom:8px;
}
</style>

</head>
<body>

<div class="container">

<h1>🛒 Der Einkaufsassistent</h1>

<p class="untertitel">
Intelligent einkaufen. Einfach entscheiden.
</p>
<div class="dashboard">
<div class="karte">
⭐ Favoriten
<br>
<span id="favoritenCount">0</span>
</div>
<div class="karte">
🛒 Liste
<br>
<span id="listeCount">0</span>
</div>

<div class="karte">
🔥 Aktionen
<br>
Bald verfügbar
</div>

<div class="karte">
⚙️ Assistent
<br>
Aktiv
</div>

<h3>⭐ Favoriten</h3>
<div id="favoriten"></div>
</div>
<p style="text-align:center;color:#64748b;">
Intelligent einkaufen. Einfach entscheiden.
</p>
<div class="eingabeKarte">

<h3>➕ Produkt hinzufügen</h3>
<input id="produkt" placeholder="Produkt eingeben">
<div class="mengenZeile">  
<input
id="menge"
type="number"
value="1"
min="1"
placeholder="Menge">
<select id="einheit">
<option value="">Keine</option>
<option value="Stück">Stück</option>
<option value="g">g</option>
<option value="kg">kg</option>
<option value="Liter">Liter</option>
<option value="Packung">Packung</option>
</select>
    
</div>
    
<div id="vorschlaege"></div>
<button onclick="addProduct()">
Produkt hinzufügen
</button>
</div>

<h3>Aktuelle Einkaufsliste</h3>
<div id="liste"></div>

<h3>🕓 Zuletzt gekauft</h3>
<div id="history"></div>
<h3>⭐ Häufig gekauft</h3>
<div id="haeufig"></div>
</div>

<script>

let liste =
JSON.parse(localStorage.getItem("liste")) || [];

let historyListe =
JSON.parse(localStorage.getItem("history")) || [];
let gekauft =
JSON.parse(localStorage.getItem("gekauft")) || {};
let standardMengen =
JSON.parse(localStorage.getItem("standardMengen")) || {};
let produkteInfo =
JSON.parse(localStorage.getItem("produkteInfo")) || {};   
let standardProdukte = [
"Milch",
"Mozzarella",
"Käse",
"Butter",
"Bananen",
"Äpfel",
"Tomaten",
"Eier",
"Cola"
];

let produkte =
JSON.parse(localStorage.getItem("produkte")) ||
standardProdukte;
    
let kategorien = {

"Milch":"🥛 Milchprodukte",
"Mozzarella":"🥛 Milchprodukte",
"Käse":"🥛 Milchprodukte",

"Rivella":"🥤 Getränke",
"Cola":"🥤 Getränke",

"Gurke":"🥬 Gemüse",
"Tomaten":"🥬 Gemüse",
"Karotten":"🥬 Gemüse",

"Fleisch":"🥩 Fleisch"

};    
let feld =
document.getElementById("produkt");

feld.addEventListener("input",function(){

let suche =
feld.value.toLowerCase();

let treffer =
produkte.filter(p =>
p.toLowerCase().startsWith(suche)
);

let vorschlaege =
document.getElementById("vorschlaege");

vorschlaege.innerHTML="";

if(suche.length<1){
return;
}

treffer.slice(0,5).forEach(function(produkt){

vorschlaege.innerHTML +=
'<div class="history" onclick="waehleProdukt(\''+
produkt+
'\')">'+
produkt+
'</div>';

});

});
function waehleProdukt(produkt){

document.getElementById("produkt").value =
produkt;

document.getElementById("vorschlaege").innerHTML =
"";

}
function speichern(){

localStorage.setItem(
"liste",
JSON.stringify(liste)
);

localStorage.setItem(
"history",
JSON.stringify(historyListe)
);
localStorage.setItem(
"produkte",
JSON.stringify(produkte)
);
localStorage.setItem(
"standardMengen",
JSON.stringify(standardMengen)
);
localStorage.setItem(
"produkteInfo",
JSON.stringify(produkteInfo)
);
    
}

function addProduct(){

let feld =
document.getElementById("produkt");
let menge =
document.getElementById("menge").value;

let einheit =
document.getElementById("einheit").value;

let text =
feld.value.trim();

text =
text.charAt(0).toUpperCase() +
text.slice(1).toLowerCase();
standardMengen[text] = {
    menge: menge,
    einheit: einheit
}; 
if(!produkteInfo[text]){

    produkteInfo[text] = {
        name: text,
        kaufAnzahl: 0,
        favorit: false,
        letzterKauf: ""
    };

}

produkteInfo[text].menge = menge;
produkteInfo[text].einheit = einheit;    
if(text===""){
return;
}

if(!produkte.includes(text)){
    produkte.push(text);
}

let anzeigeText = text;

if(einheit !== ""){
    anzeigeText =
    text + " (" + menge + " " + einheit + ")";
}

liste.push(anzeigeText);

feld.value="";

speichern();

anzeigen();

}

function erledigt(index){

let produkt = liste[index];
let produktName =
produkt.split(" (")[0];

if(produkteInfo[produktName]){

    produkteInfo[produktName].kaufAnzahl++;
produkteInfo[produktName].letzterKauf =
new Date().toLocaleDateString();

if(produkteInfo[produktName].kaufAnzahl >= 5){

    produkteInfo[produktName].favorit = true;

}

}    
gekauft[produkt] =
(gekauft[produkt] || 0) + 1;
if(!historyListe.includes(produkt)){
    historyListe.unshift(produkt);
}

if(historyListe.length>20){
historyListe.pop();
}

liste.splice(index,1);

speichern();

anzeigen();

}

function erneut(produkt){

if(!liste.includes(produkt)){

liste.push(produkt);

speichern();

anzeigen();

}

}
function loescheHistory(index){

historyListe.splice(index,1);

speichern();

anzeigen();

}

function anzeigen(){

let listeDiv =
document.getElementById("liste");

let historyDiv =
document.getElementById("history");
let haeufigDiv =
document.getElementById("haeufig");
let favoritenDiv =
document.getElementById("favoriten");    
let favoritenCount =
document.getElementById("favoritenCount");

let listeCount =
document.getElementById("listeCount");    
listeDiv.innerHTML="";
historyDiv.innerHTML="";
haeufigDiv.innerHTML="";
favoritenDiv.innerHTML="";   
listeCount.textContent =
liste.length;
    
let letzteKategorie = "";
let favoritenAnzahl = 0;

for(let produkt in produkteInfo){

    if(produkteInfo[produkt].favorit){

        favoritenAnzahl++;

    }

}

favoritenCount.textContent =
favoritenAnzahl;  
 for(let produkt in produkteInfo){

    if(produkteInfo[produkt].favorit){

        favoritenDiv.innerHTML +=
        '<div class="history" onclick="erneut(\''+
        produkt+
        '\')">'+
        produkt+
        '</div>';
    }

}    

listeDiv.innerHTML +=
'<div class="item" onclick="erledigt('+i+')">☐ '+
liste[i] +
'</div>';

}

for(let i=0;i<historyListe.length;i++){

historyDiv.innerHTML +=
'<div class="history" style="display:flex;justify-content:space-between;">'
+
'<span onclick="erneut(\''+
historyListe[i]+
'\')" style="cursor:pointer;">'
+
historyListe[i]
+
'</span>'
+
'<span onclick="loescheHistory('+i+')" style="color:red;cursor:pointer;">🗑️</span>'
+
'</div>';
let sortiert =
Object.keys(gekauft).sort(
(a,b) => gekauft[b] - gekauft[a]
);

for(let i=0;i<sortiert.length && i<5;i++){

let info = sortiert[i];

if(standardMengen[sortiert[i]] &&
standardMengen[sortiert[i]].einheit !== ""){

info += " (" +
standardMengen[sortiert[i]].menge +
" " +
standardMengen[sortiert[i]].einheit +
")";

}

haeufigDiv.innerHTML +=
'<div class="history" onclick="erneut(\''+
sortiert[i]+
'\')">'+
info+
'</div>';

}
}

}

anzeigen();

</script>

</body>
</html>
