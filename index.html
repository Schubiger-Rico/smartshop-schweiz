<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop Schweiz V5</title>

<style>

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1f2937;
    --accent:#5FAF3C;
    --border:#d6dce2;

    --fontSize:14px;
    --plusSize:17px;
}

body.dark{
    --bg:#121212;
    --card:#1c1c1c;
    --text:#ffffff;
    --border:#2f2f2f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    font-size:var(--fontSize);
    min-height:100vh;
}

.container{
    max-width:800px;
    margin:auto;
    padding:10px;
    padding-bottom:90px;
}

.header{
    text-align:center;
    margin-bottom:10px;
}

.logo{
    font-size:24px;
    font-weight:700;
    color:var(--accent);
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px;
    margin-bottom:8px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;

    background:var(--card);

    border-top:1px solid var(--border);

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:100;
}

.bottom-nav button{

    flex:1;

    border:none;

    background:none;

    color:var(--text);

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    height:100%;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            🛒 SmartShop V5
        </div>
    </div>

    <div id="page-list" class="page active">

        <div class="card">
            Einkaufsliste wird im nächsten Block erstellt.
        </div>

    </div>

    <div id="page-favoriten" class="page">

        <div class="card">
            Favoriten folgen später.
        </div>

    </div>

    <div id="page-ideen" class="page">

        <div class="card">
            Ideenbereich folgt später.
        </div>

    </div>

    <div id="page-aktionen" class="page">

        <div class="card">
            Aktionen folgen später.
        </div>

    </div>

    <div id="page-settings" class="page">

        <div class="card">
            Einstellungen folgen später.
        </div>

    </div>

</div>

<div class="bottom-nav">

    <button onclick="showPage('list')">
        🛒<br>Liste
    </button>

    <button onclick="showPage('favoriten')">
        ⭐<br>Favoriten
    </button>

    <button onclick="showPage('ideen')">
        💡<br>Ideen
    </button>

    <button onclick="showPage('aktionen')">
        🔥<br>Aktionen
    </button>

    <button onclick="showPage('settings')">
        ⚙️<br>Settings
    </button>

</div>

<script>

function showPage(page){

    document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

    document
    .getElementById(
        "page-" + page
    )
    .classList
    .add("active");
}

</script>

</body>
</html>
