<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14231e;--mute:#5d6e67;--line:#d9e1dd;--red:#c8453b;--yel:#c99a12;--grn:#2e9e57;--acc:#39FF14;--accd:#0a5c00;--onacc:#fff;--fs:18px;--rh:calc(var(--fs)*1.67);--lg:#bff0cc;--dg:#0a5c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#1a2622;--ink:#e8f0ec;--mute:#93a59d;--line:#3a4c46;--red:#e5766d;--yel:#e3b93f;--grn:#5dc783}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#1a2622;--ink:#e8f0ec;--mute:#93a59d;--line:#3a4c46;--red:#e5766d;--yel:#e3b93f;--grn:#5dc783}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.35 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
#app{max-width:40em;margin:0 auto;padding:.75em .75em 6em;overflow-x:hidden}html.touring #app{overflow:visible}
h1,h2,h3{font-family:Quicksand,"Trebuchet MS",sans-serif;font-weight:700;margin:0}
h1{font-size:1.3em;line-height:1.1}h2{font-size:1.15em;margin:1.2em 0 .5em}h3{font-size:1em;margin:.8em 0 .3em}
header{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:.6em;gap:.5em}
button,input,select,textarea{font:inherit;color:inherit}
.brand{font-size:1.6em;color:#39FF14;-webkit-text-stroke:.09em #0a5c00;paint-order:stroke fill;font-weight:800;font-style:italic;letter-spacing:.02em;font-family:"Baloo 2","Trebuchet MS",Quicksand,sans-serif}
.ttl{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:.5em}.sub{font:italic 700 .95em "Baloo 2","Trebuchet MS",Quicksand,sans-serif;color:var(--dg);display:inline}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sub{color:#39FF14}}:root[data-theme=dark] .sub{color:#39FF14}
.btn{min-height:var(--rh);min-width:var(--rh);padding:0 .8em;border:1px solid var(--line);background:var(--card);border-radius:.7em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.3em}
.btn.sq{width:var(--rh);height:var(--rh);padding:0;flex:none}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.btn.sel{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.field{height:var(--rh);padding:0 .6em;border:1px solid var(--line);background:var(--card);border-radius:.7em;min-width:0}
textarea.field{height:8em;padding:.6em;width:100%}
.add{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.4em;align-items:center}
.add .nm{flex:1 1 4em;min-width:4em}.add{flex-wrap:nowrap}
.add .qty{width:calc(3ch + 1.6em);text-align:center;padding:0;flex:none}
.add .un{flex:none}
.sug{display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:.6em;min-height:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:.7em;padding:.1em .7em;min-height:calc(var(--rh)*.8);cursor:pointer;display:inline-flex;align-items:center;gap:.3em}
header .stop{max-width:9em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:inline-block;line-height:var(--rh);flex:none;margin-left:auto;font-size:.85em;border-color:var(--red)}
header .stop{}
.chip.sel{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.qu{flex:none;padding:0 .5em;min-width:calc(var(--rh)*1.7)}
.q[data-a]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:.2em}
.wheels{position:relative;display:flex;gap:.5em;margin:.5em 0;--wo:calc(var(--rh)*1.55)}
.wheel{flex:1;height:calc(var(--wo)*5);overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;scrollbar-width:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:calc(var(--wo)*2)}
.wheel .o{height:var(--wo);line-height:var(--wo);font-size:1.45em;scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;color:var(--mute);transition:color .1s}.wheel .o.on{color:var(--ink);font-weight:800}
.band{position:absolute;left:0;right:0;top:calc(var(--wo)*2);height:var(--wo);background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid var(--acc);border-radius:.5em;pointer-events:none}
.ic{width:var(--rh);height:var(--rh);flex:none;display:inline-grid;place-items:center;background:transparent;border:clamp(1px,calc(var(--rh)*.08),3px) solid var(--dg);border-radius:20%;padding:0;font-size:.95em;line-height:1;cursor:pointer;box-shadow:none;animation:none;color:var(--ink)}
.card{display:flex;align-items:center;gap:.4em;min-height:var(--rh);padding:.25em .4em .25em .35em;margin-bottom:.4em;background:var(--card);border:1px solid var(--line);border-radius:.7em;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.blk{display:block;user-select:text;-webkit-user-select:text;touch-action:auto}
.card .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.card .q{color:var(--mute);white-space:nowrap}
.card.done .nm{color:var(--mute)}
.fire{font-size:.95em}
.fire.off{opacity:.4;filter:grayscale(.6)}
.fire.on{opacity:1}
.menu{position:absolute;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:.7em;padding:.3em;min-width:13em;box-shadow:0 .5em 1.5em #0003}
.menu button{display:flex;gap:.6em;width:100%;text-align:left;border:0;background:none;padding:.5em .7em;border-radius:.5em;cursor:pointer}
.menu button.cur{background:var(--acc);color:var(--onacc)}
.menu.min button .ml{display:none}.menu.big{font-size:1.25em}
.empty{padding:1.2em 1em;border:1px dashed var(--line);border-radius:.7em;color:var(--mute);text-align:center;margin-bottom:.4em}
.row{display:flex;align-items:center;justify-content:space-between;gap:.8em;padding:.45em 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;gap:.3em;flex-wrap:wrap}
.ban{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.5em .7em;margin-bottom:.5em;background:var(--card);border:1px solid var(--acc);border-radius:.7em;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{padding:0;width:calc(var(--fs)*2.5);cursor:pointer}
.mute{color:var(--mute)}.small{font-size:.85em}
.sheet{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);border-radius:1em 1em 0 0;max-height:88vh;overflow:auto;padding:1em;width:100%;max-width:40em;border:1px solid var(--line)}
.grid{display:flex;flex-wrap:wrap;gap:.35em}
.grid .ic{cursor:pointer}
.hl{position:relative;z-index:65;box-shadow:0 0 0 .25em var(--acc),0 0 0 100vmax #0009!important;border-radius:.7em}
.tc{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:.8em;display:flex;justify-content:center;pointer-events:none}
.tc .tmb{border:2px solid var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.tc .tm p{margin:.35em 0}
.tc>.card>.seg{position:sticky;bottom:-.1em;background:var(--card);padding:.3em 0}
.tb{background:#ffe066;color:#3a2e00;border:2px dashed #b38f00;border-radius:.8em;padding:.7em .9em;margin:.2em 0 .8em}.tbh{font-weight:800;font-size:1.3em;margin-bottom:.2em}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1em + env(safe-area-inset-bottom,0px));z-index:85;display:flex;gap:.6em;align-items:center;background:var(--ink);color:var(--bg);padding:.4em .5em .4em 1em;border-radius:.8em;box-shadow:0 .3em 1em #0005;max-width:92vw}
.ns{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;color:#fff;border-radius:.4em;padding:0 .3em}
.card.urg{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card))}.card.urg .nm{font-size:1.25em;font-weight:800}.urgb.on{background:var(--red);border-color:var(--red);color:#fff}
html.compact .card{min-height:0;padding:1px .3em;margin-bottom:.2em;gap:.3em;line-height:1.15}html.compact .card .btn.sq,html.compact .card .ic{width:calc(var(--rh)*.7);height:calc(var(--rh)*.7);min-width:0;min-height:0;font-size:.85em}html.compact .card.urg .nm{font-size:1.15em}
.topbar{flex-wrap:nowrap;overflow-x:auto;gap:.3em}.topbar .btn{padding:0 .5em;white-space:nowrap}
