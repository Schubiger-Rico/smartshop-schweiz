<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop Schweiz</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0078ff;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#005fd1;
}

.item{
    background:#eeeeee;
    margin-top:8px;
    padding:12px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.deleteBtn{
    width:auto;
    background:#d60000;
    padding:6px 10px;
}

.deleteBtn:hover{
    background:#a00000;
}

</style>

</head>

<body>

<div class="container">

<h1>🛒 SmartShop Schweiz</h1>

<input
id="produkt"
type="text"
placeholder="Produkt eingeben">

<button onclick="addProduct()">
Produkt hinzufügen
</button>

<h3>Einkaufsliste</h3>

<div id="liste"></div>

</div>

<script>

let liste =
JSON.parse(localStorage.getItem("liste")) || [];

function speichern(){

    localStorage.setItem(
        "liste",
        JSON.stringify(liste)
    );

}

function addProduct(){

    let feld =
    document.getElementById("produkt");

    let wert =
    feld.value.trim();

    if(wert===""){
        return;
    }

    liste.push({
        text: wert,
        erledigt: false
    });

    speichern();

    feld.value="";

    renderListe();

}

function umschalten(index){

    liste[index].erledigt =
    !liste[index].erledigt;

    speichern();

    renderListe();

}

function loeschen(index){

    liste.splice(index,1);

    speichern();

    renderListe();

}

function renderListe(){

    const anzeige =
    document.getElementById("liste");

    anzeige.innerHTML="";

    liste.forEach(function(produkt,index){

        anzeige.innerHTML += `

        <div class="item">

            <div onclick="umschalten(${index})"
                 style="cursor:pointer">

                ${produkt.erledigt ? "✅" : "⬜"}
                ${produkt.text}

            </div>

            <button
            class="deleteBtn"
            onclick="loeschen(${index})">
            🗑️
            </button>

        </div>

        `;

    });

}

renderListe();

</script>

</body>
</html>
