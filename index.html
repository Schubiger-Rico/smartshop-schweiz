<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

<style>

:root{
    --green:#78b84d;
    --darkgreen:#2f6d1d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f6f8;
    color:#000;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:8px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:5px;
}

.menu-btn{

    width:44px;
    height:44px;

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    color:black;

    font-size:22px;

    font-weight:600;

    cursor:pointer;
}

.logo{

    text-align:center;

    font-family:'Quicksand',sans-serif;

    font-size:38px;

    color:var(--green);

    margin-bottom:12px;

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu{

    display:none;

    justify-content:space-between;

    gap:0;

    margin-bottom:12px;
}

.menu.show{
    display:flex;
}

.navBtn{

    width:19%;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    text-align:center;

    padding:4px 2px;
}

.navIcon{

    font-size:18px;

    text-align:center;

    margin-bottom:2px;
}

.navText{

    font-size:12px;

    font-weight:600;

    text-align:center;
}

/* EINGABEZEILE */

.inputRow{

    display:flex;

    gap:0;

    margin-bottom:10px;
}

.inputRow input,
.inputRow select{

    height:34px;

    border:2px solid var(--darkgreen);

    border-radius:0;

    font-size:16px;

    font-weight:600;

    color:black;

    padding:0 8px;
}

#produkt{
    flex:1;
}

#menge{

    width:55px;

    text-align:center;
}

#einheit{

    width:70px;
}

.addBtn{

    width:50px;

    height:34px;

    border:none;

    background:var(--green);

    color:white;

    font-size:22px;

    font-weight:600;

    cursor:pointer;
}

/* LISTE */

.card{

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    padding:6px;
}

.cardTitel{

    font-size:16px;

    font-weight:600;

    margin-bottom:6px;
}

.item{

    display:flex;

    gap:0;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    height:30px;

    border:2px solid var(--darkgreen);

    border-radius:0;

    display:flex;

    align-items:center;

    padding:0 8px;

    font-size:16px;

    font-weight:600;

    background:white;
}

.menge,
.einheit{

    height:30px;

    border:2px solid var(--darkgreen);

    border-radius:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:16px;

    font-weight:600;

    background:white;
}

.menge{
    width:40px;
}

.einheit{
    width:50px;
}

.actionBtn{

    width:30px;

    height:30px;

    border:none;

    color:white;

    font-size:16px;

    cursor:pointer;
}

.action-green{
    background:#43a047;
}

.action-red{
    background:#d84315;
}

.doneBtn{

    width:34px;

    height:30px;

    border:none;

    background:var(--green);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

    <div class="topbar">

        <button
        class="menu-btn"
        onclick="toggleMenu()">
            ⋮
        </button>

    </div>

    <div class="logo">
        SmartShop V5
    </div>

    <div
    class="menu"
    id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Settings</div>
        </div>

    </div>

    <div class="inputRow">

        <input
        id="produkt"
        placeholder="Produkt">

        <input
        id="menge"
        value="0">

        <select id="einheit">
            <option>Stk</option>
            <option>kg</option>
            <option>g</option>
            <option>Liter</option>
            <option>ml</option>
        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="item">

            <div class="produkt">
                Milch
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button
            class="actionBtn action-green">
                🔥
            </button>

            <button
            class="doneBtn">
                ✓
            </button>

        </div>

        <div class="item">

            <div class="produkt">
                Kaffee
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button
            class="actionBtn action-red">
                🔥
            </button>

            <button
            class="doneBtn">
                ✓
            </button>

        </div>

    </div>

</div>

<script>

function toggleMenu(){

    document
    .getElementById("menu")
    .classList
    .toggle("show");

}

</script>

</body>
</html>
