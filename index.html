var shareMsg='',pushT=null,lastJson='',pollT=null,applying=false;
function shareOn(){return !!(S.share&&S.share.code&&S.set.fbUrl&&/^https:\/\//.test(S.set.fbUrl))}
function shUrl(){return S.set.fbUrl.replace(/\/+$/,'')+'/lists/'+encodeURIComponent(S.share.code)+'.json'}
function liveItems(){return S.items.filter(function(i){return !i.tour})}
function pushSoon(){if(!shareOn()||applying)return;clearTimeout(pushT);pushT=setTimeout(pushNow,800)}
function pushNow(cb){if(!shareOn())return;var it=liveItems(),j=JSON.stringify(it);if(j===lastJson){if(cb)cb();return}var t0=Date.now();
 fetch(shUrl(),{method:'PUT',body:JSON.stringify({items:it,t:t0,by:S.share.dev})}).then(function(r){if(!r.ok)throw r.status;lastJson=j;S.share.t=t0;shareMsg=t('Verbunden. Zuletzt gesendet {0}',new Date().toLocaleTimeString('de-CH'));if(cb)cb()}).catch(function(e){shareMsg=t('Senden fehlgeschlagen ({0}). Adresse und Regeln prüfen.',e)})}
function remoteItems(d){var a=d&&d.items?(Array.isArray(d.items)?d.items:Object.keys(d.items).map(function(k){return d.items[k]})):[];
 return a.filter(Boolean).map(function(i){return{id:i.id||uid(),name:i.name,qty:i.qty>=0?i.qty:0,unit:i.unit||'',fire:!!i.fire,cat:i.cat||null,sub:i.sub||null,why:i.why||'',type:i.type||null,stores:i.stores||[],stext:i.stext||''}})}
function pollNow(){if(!shareOn()||document.hidden)return;
 fetch(shUrl()).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){
  if(!d){lastJson='';pushNow();return}
  if(d.by!==S.share.dev&&d.t>(S.share.t||0)){var a=document.activeElement,busy=sh||editId||tour||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));if(busy)return;
   applying=true;S.items=remoteItems(d);S.share.t=d.t;lastJson=JSON.stringify(liveItems());save();applying=false;shareMsg=t('Verbunden. Aktualisiert {0}',new Date().toLocaleTimeString('de-CH'));R()}
 }).catch(function(e){shareMsg=t('Keine Verbindung ({0})',e)})}
function startShare(){clearInterval(pollT);if(shareOn()){pollNow();pollT=setInterval(pollNow,5000)}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)pollNow()});
function newCode(){var s='',c='abcdefghjkmnpqrstuvwxyz23456789';for(var i=0;i<14;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s}
function shareNew(){if(!/^https:\/\//.test(S.set.fbUrl||'')){say(t('Bitte zuerst die Datenbank-Adresse eintragen.'));return}
 S.share={code:newCode(),t:0,dev:S.share.dev||uid()};lastJson='';save();pushNow(function(){startShare();R()});R()}
function shareJoin(code){if(!/^https:\/\//.test(S.set.fbUrl||'')){say(t('Bitte zuerst die Datenbank-Adresse eintragen.'));return}
 if(code.length<8){say(t('Der Code ist zu kurz.'));return}
 S.share={code:code.toLowerCase(),t:0,dev:S.share.dev||uid()};lastJson='';
 fetch(shUrl()).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){
  var rem=remoteItems(d);liveItems().forEach(function(l){if(!rem.some(function(x){return norm(x.name)===norm(l.name)&&x.unit===l.unit}))rem.push(l)});
  S.items=rem;if(d)S.share.t=d.t||0;save();pushNow(function(){startShare();R()});say(t('Liste verbunden.'));R()}).catch(function(e){S.share.code='';shareMsg=t('Verbindung fehlgeschlagen ({0})',e);R()})}

 else h+='<div class="seg"><button class="btn pri" data-a="sharenew">'+t('Neue geteilte Liste starten')+'</button></div><h3>'+t('Oder einer Liste beitreten')+'</h3><div class="seg"><input class="field" id="shc" placeholder="'+t('Listen-Code')+'" style="flex:1 1 9em"><button class="btn" data-a="sharejoin">'+t('Beitreten')+'</button></div>';
 if(shareMsg)h+='<p class="small">'+esc(shareMsg)+'</p>';
 h+='<details><summary>'+t('Einrichtung (einmalig, etwa 5 Minuten)')+'</summary><ol class="small"><li>'+t('Auf console.firebase.google.com mit einem Google-Konto ein Projekt erstellen (Google Analytics ausschalten).')+'</li><li>'+t('Links «Build» → «Realtime Database» → «Datenbank erstellen», Standort Europa, «Im Testmodus starten».')+'</li><li>'+t('Oben die Adresse kopieren (beginnt mit https://) und hier einfügen.')+'</li><li>'+t('Im Reiter «Regeln» diesen Text einfügen und veröffentlichen:')+' <code>{"rules":{"lists":{"$c":{".read":true,".write":true}}}}</code></li></ol><p class="small mute">'+t('Wer den langen Code kennt, kann die Liste lesen und ändern. Für den Test reicht das.')+'</p></details>';
