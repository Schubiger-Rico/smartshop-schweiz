<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5 Schriftentest</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Nunito:wght@800&family=Poppins:wght@800&family=Outfit:wght@800&display=swap" rel="stylesheet">

<style>

body{
    background:#f4f6f8;
    padding:20px;
    font-family:Arial,sans-serif;
}

.test{
    margin-bottom:30px;
}

.rubik{
    font-family:'Rubik',sans-serif;
}

.nunito{
    font-family:'Nunito',sans-serif;
}

.poppins{
    font-family:'Poppins',sans-serif;
}

.outfit{
    font-family:'Outfit',sans-serif;
}

.logo{

    font-size:40px;

    font-weight:800;

    letter-spacing:1px;

    color:#5FAF3C;

    text-shadow:
    -2px -2px 0 #2f6d1d,
     2px -2px 0 #2f6d1d,
    -2px  2px 0 #2f6d1d,
     2px  2px 0 #2f6d1d;

}

.beschriftung{
    font-size:16px;
    color:black;
    margin-bottom:5px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="test">

    <div class="beschriftung">
        Schrift 1 - Rubik
    </div>

    <div class="logo rubik">
        SmartShop V5
    </div>

</div>

<div class="test">

    <div class="beschriftung">
        Schrift 2 - Nunito
    </div>

    <div class="logo nunito">
        SmartShop V5
    </div>

</div>

<div class="test">

    <div class="beschriftung">
        Schrift 3 - Poppins
    </div>

    <div class="logo poppins">
        SmartShop V5
    </div>

</div>

<div class="test">

    <div class="beschriftung">
        Schrift 4 - Outfit
    </div>

    <div class="logo outfit">
        SmartShop V5
    </div>

</div>

</body>
</html>
