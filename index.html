<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

<style>

:root{

    --bg:#f4f6f8;
    --card:#ffffff;

    --text:#000000;

    --green:#78b84d;

    --border:#2f6d1d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:var(--text);

    font-family:Arial,sans-serif;

    min-height:100vh;
}

.container{

    max-width:800px;

    margin:auto;

    padding:10px;

    padding-bottom:60px;
}

.logo{

    text-align:center;

    font-family:'Quicksand',sans-serif;

    font-size:36px;

    font-weight:700;

    color:var(--green);

    letter-spacing:1px;

    margin:10px 0 15px;

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.card{

    background:var(--card);

    border:2px solid var(--border);

    border-radius:12px;

    padding:10px;

    margin-bottom:8px;

    color:black;
}

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:48px;

    background:white;

    border-top:2px solid var(--border);

    display:flex;
}

.bottom-nav button{

    flex:1;

    background:white;

    color:black;

    border:none;

    border-left:2px solid var(--border);

    font-size:12px;

    font-weight:600;
}

.bottom-nav button:first-child{

    border-left:none;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        SmartShop V5
    </div>

    <div class="card">
        Einkaufsliste wird im nächsten Block erstellt.
    </div>

</div>

<div class="bottom-nav">

    <button>🛒 Liste</button>

    <button>⭐ Favoriten</button>

    <button>💡 Ideen</button>

    <button>🔥 Aktionen</button>

    <button>⚙️ Settings</button>

</div>

</body>
</html>
