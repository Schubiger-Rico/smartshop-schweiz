<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Oswald:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{

    --green:#9BC45A;
    --darkgreen:#4C8A34;
    --bg:#f5f6f7;

    /* Später einstellbar 10-30 */

    --fontSize:18px;

    /* Verhältnis 30:18 */

    --rowHeight:calc(var(--fontSize) * 1.67);

    --buttonSize:var(--rowHeight);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:#000;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;
}

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:8px;
}

/* ========================= */
/* TITEL */
/* ========================= */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:8px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:58%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#000;

    font-size:22px;

    font-weight:700;

    letter-spacing:-2px;

    cursor:pointer;
}

/* ========================= */
/* NAVIGATION */
/* ========================= */

.menu{

    display:none;

    gap:2px;

    margin-bottom:8px;
}

.menu.show{

    display:flex;
}

.navBtn{

    flex:1;

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    text-align:center;

    padding:3px;
}

.navIcon{

    font-size:16px;

    line-height:1;
}

.navText{

    font-size:10px;

    font-weight:500;

    line-height:1;
}

/* ========================= */
/* EINGABEZEILE */
/* ========================= */

.inputRow{

    display:flex;

    gap:2px;

    margin-bottom:8px;
}

.inputRow input,
.inputRow select{

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;

    padding:0 4px;
}

/* PRODUKT */

#produkt{

    flex:1;

    min-width:50px;
