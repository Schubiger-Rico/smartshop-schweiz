<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{

    --green:#9BC45A;
    --darkgreen:#4C8A34;
    --bg:#f5f6f7;

    /* EINZIGE VARIABLE */
    --fontSize:16px;

    /* ALLES WIRD DARAUS BERECHNET */
    --rowHeight:calc(var(--fontSize) * 2);

    --buttonSize:var(--rowHeight);

    --iconSize:calc(var(--fontSize) + 2px);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:#000;

    font-family:'Roboto Condensed',sans-serif;

    font-size:var(--fontSize);
}

.container{

    max-width:900px;

    margin:auto;

    padding:8px;
}

/* =====================
   TITEL
===================== */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:8px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:58%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#000;

    font-size:22px;

    letter-spacing:-2px;

    font-weight:900;

    cursor:pointer;
}

/* =====================
   NAVIGATION
===================== */

.menu{

    display:none;

    gap:4px;

    margin-bottom:10px;
}

.menu.show{

    display:flex;
}

.navBtn{

    flex:1;

    background:#fff;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    text-align:center;

    padding:2px;
}

.navIcon{

    font-size:var(--iconSize);

    line-height:1;
}

.navText{

    font-size:12px;

    font-weight:600;
}

/* =====================
   EINGABEZEILE
===================== */

.inputRow{

    display:flex;

    gap:4px;

    margin-bottom:10px;
}

.inputRow input,
.inputRow select{

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-family:'Roboto Condensed',sans-serif;

    font-size:var(--fontSize);

    font-weight:600;

    padding:0 8px;
}

#produkt{

    flex:1;

    min-width:100px;
}

/* PLATZ FÜR 999 */

#menge{

    width:4ch;

    min-width:4ch;

    text-align:center;

    flex-shrink:0;
}

/* PLATZ FÜR LITER */

#einheit{

    width:6ch;

    min-width:6ch;

    flex-shrink:0;
}

/* QUADRATISCH */

.addBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    flex-shrink:0;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:#fff;

    font-size:calc(var(--fontSize) + 4px);

    font-weight:700;

    cursor:pointer;
}

/* =====================
   EINKAUFSLISTE
===================== */

.card{

    background:#fff;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    padding:8px;
}

.cardTitel{

    font-size:calc(var(--fontSize) + 2px);

    font-weight:700;

    margin-bottom:8px;
}

.item{

    display:flex;

    gap:4px;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    min-width:100px;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    padding:0 8px;

    background:white;

    font-size:var(--fontSize);

    font-weight:600;
}

/* PLATZ FÜR 999 */

.menge{

    width:4ch;

    min-width:4ch;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-size:var(--fontSize);

    font-weight:600;
}

/* PLATZ FÜR LITER */

.einheit{

    width:6ch;

    min-width:6ch;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-size:var(--fontSize);

    font-weight:600;
}

.actionBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    border:none;

    border-radius:4px;

    color:white;

    font-size:var(--iconSize);

    cursor:pointer;
}

.action-green{

    background:#43a047;
}

.action-red{

    background:#d84315;
}

.doneBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:var(--iconSize);

    font-weight:700;

    cursor:pointer;
}

/* =====================
   RESPONSIVE
===================== */

@media(max-width:420px){

    .logo{
        font-size:30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="titleRow">

        <div class="logo">
            SmartShop V5
        </div>

        <button
            class="menu-btn"
            onclick="toggleMenu()">
            •••
        </button>

    </div>

    <div class="menu" id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Settings</div>
        </div>

    </div>

    <div class="inputRow">

        <input
            id="produkt"
            placeholder="Produkt">

        <input
            id="menge"
            value="0">

        <select id="einheit">

            <option>Stk</option>
            <option>kg</option>
            <option>g</option>
            <option>ml</option>
            <option>Liter</option>

        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="item">

            <div class="produkt">
                Milch
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-green">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

        <div class="item">

            <div class="produkt">
                Kaffee
            </div>

            <div class="menge">
                2
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-red">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

    </div>

</div>

<script>

function toggleMenu(){

    document
        .getElementById("menu")
        .classList
        .toggle("show");
}

</body>
</html>
