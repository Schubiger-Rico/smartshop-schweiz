<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --green:#8BC34A;
    --darkgreen:#3E7C2A;
    --bg:#f5f6f7;
    --fontSize:16px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:#000;

    font-family:'Inter',sans-serif;

    font-size:var(--fontSize);
}

.container{

    max-width:900px;

    margin:auto;

    padding:8px;
}

/* =========================
   TITEL
========================= */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:10px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:58%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#000;

    font-size:22px;

    font-weight:900;

    letter-spacing:-2px;

    cursor:pointer;
}

/* =========================
   NAVIGATION
========================= */

.menu{

    display:none;

    gap:4px;

    margin-bottom:10px;
}

.menu.show{

    display:flex;
}

.navBtn{

    flex:1;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    text-align:center;

    padding:4px 2px;
}

.navIcon{

    font-size:18px;

    margin-bottom:2px;
}

.navText{

    font-size:12px;

    font-weight:600;
}

/* =========================
   EINGABEZEILE
========================= */

.inputRow{

    display:flex;

    gap:4px;

    margin-bottom:10px;
}

#produkt{

    flex:1;

    min-width:120px;
}

#menge{

    width:5ch;

    text-align:center;

    flex-shrink:0;
}

#einheit{

    width:6ch;

    flex-shrink:0;
}

.inputRow input,
.inputRow select{

    height:40px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-family:'Inter',sans-serif;

    font-size:var(--fontSize);

    font-weight:600;

    padding:0 8px;
}

.addBtn{

    width:40px;

    height:40px;

    flex-shrink:0;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:22px;

    font-weight:600;

    cursor:pointer;
}

/* =========================
   KARTE
========================= */

.card{

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    padding:8px;
}

.cardTitel{

    font-size:18px;

    font-weight:600;

    margin-bottom:8px;
}

/* =========================
   LISTE
========================= */

.item{

    display:flex;

    gap:4px;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    min-width:120px;

    height:40px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    padding:0 10px;

    background:white;

    font-family:'Inter',sans-serif;

    font-size:var(--fontSize);

    font-weight:600;
}

.menge{

    width:5ch;

    height:40px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-weight:600;
}

.einheit{

    width:6ch;

    height:40px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-weight:600;
}

.actionBtn{

    width:40px;

    height:40px;

    border:none;

    border-radius:4px;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.action-green{

    background:#43a047;
}

.action-red{

    background:#d84315;
}

.doneBtn{

    width:40px;

    height:40px;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:18px;

    font-weight:600;

    cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:420px){

    .logo{
        font-size:30px;
    }

    .navText{
        font-size:11px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="titleRow">

        <div class="logo">
            SmartShop V5
        </div>

        <button
            class="menu-btn"
            onclick="toggleMenu()">
            •••
        </button>

    </div>

    <div
        class="menu"
        id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Settings</div>
        </div>

    </div>

    <div class="inputRow">

        <input
            id="produkt"
            placeholder="Produkt">

        <input
            id="menge"
            value="0">

        <select id="einheit">

            <option>Stk</option>
            <option>kg</option>
            <option>g</option>
            <option>ml</option>
            <option>Liter</option>

        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="item">

            <div class="produkt">
                Milch
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-green">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

        <div class="item">

            <div class="produkt">
                Kaffee
            </div>

            <div class="menge">
                2
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-red">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

    </div>

</div>

<script>

function toggleMenu(){

    document
        .getElementById("menu")
        .classList
        .toggle("show");
}

</script>

</body>
</html>
