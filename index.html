<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop Schweiz</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;

    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0078ff;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078ff;
    color:white;
    font-size:16px;
}

.item{
    background:#f1f1f1;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    cursor:pointer;
}

.history{
    background:#fafafa;
    color:#666;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

h3{
    margin-top:25px;
}

</style>
</head>
