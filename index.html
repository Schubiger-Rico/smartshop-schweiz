<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop Schweiz V5</title>

<style>

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1f2937;
    --accent:#5FAF3C;
    --border:#d6dce2;
    --fontSize:18px;
}

body.dark{
    --bg:#111111;
    --card:#1d1d1d;
    --text:#ffffff;
    --border:#5FAF3C;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    font-size:var(--fontSize);
}

.container{
    max-width:800px;
    margin:auto;
    padding:10px;
    padding-bottom:90px;
}

h1{
    text-align:center;
    color:var(--accent);
    margin:10px 0;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
    margin-bottom:10px;
}

.input-row{
    display:flex;
    gap:6px;
    align-items:center;
}

#produkt,
#menge,
#einheit{
    height:48px;

    border:1px solid var(--border);

    border-radius:10px;

    background:var(--card);

    color:var(--text);

    font-size:18px;

    font-weight:600;
}

#produkt{
    flex:1;
    padding:0 14px;
}

#menge{
    width:60px;
    text-align:center;
}

#einheit{
    width:90px;
    text-align:center;
}

#addBtn{
    width:60px;
    height:48px;

    background:var(--accent);

    color:white;

    border:none;

    border-radius:10px;

    font-size:28px;
    font-weight:700;

    cursor:pointer;
}

.item{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:10px;

    padding:8px 10px;

    margin-top:6px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}
