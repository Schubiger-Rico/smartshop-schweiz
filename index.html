<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

<style>

:root{
    --green:#78b84d;
    --darkgreen:#2f6d1d;
    --bg:#f4f6f8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:#000;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:8px;
}

/* TITEL */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:6px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-align:center;

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:50%;

    transform:translateY(-50%);

    background:none;

    border:none;

    color:#000;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

    letter-spacing:-1px;

    padding:0;
}

/* NAVIGATION */

.menu{

    display:none;

    justify-content:space-between;

    gap:0;

    margin-bottom:10px;
}

.menu.show{
    display:flex;
}

.navBtn{

    width:19%;

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    text-align:center;

    padding:4px 2px;
}

.navIcon{

    font-size:18px;

    margin-bottom:2px;
}

.navText{

    font-size:12px;

    font-weight:600;
}

/* EINGABE */

.inputRow{

    display:flex;

    gap:0;

    margin-bottom:8px;
}

.inputRow input,
.inputRow select{

    height:36px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-size:16px;

    font-weight:600;

    color:#000;

    padding:0 8px;
}

#produkt{
    flex:1;
}

#menge{

    width:70px;

    text-align:center;
}

#einheit{

    width:70px;
}

.addBtn{

    width:70px;

    height:36px;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:22px;

    font-weight:600;

    cursor:pointer;
}

/* KARTE */

.card{

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    padding:5px;
}

.cardTitel{

    font-size:16px;

    font-weight:600;

    margin-bottom:6px;
}

/* LISTE */

.item{

    display:flex;

    gap:0;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    height:30px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    padding:0 8px;

    font-size:16px;

    font-weight:600;

    background:white;
}

.menge,
.einheit{

    height:30px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    font-size:16px;

    font-weight:600;
}

.menge{
    width:40px;
}

.einheit{
    width:55px;
}

.actionBtn{

    width:32px;

    height:30px;

    border:none;

    border-radius:4px;

    color:white;

    font-size:15px;

    cursor:pointer;
}

.action-green{
    background:#43a047;
}

.action-red{
    background:#d84315;
}

.doneBtn{

    width:36px;

    height:30px;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

    <div class="titleRow">

        <div class="logo">
            SmartShop V5
        </div>

        <button
        class="menu-btn"
        onclick="toggleMenu()">
            •••
        </button>

    </div>

    <div
    class="menu"
    id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Settings</div>
        </div>

    </div>

    <div class="inputRow">

        <input
        id="produkt"
        placeholder="Produkt">

        <input
        id="menge"
        value="0">

        <select id="einheit">

            <option>Stk</option>
            <option>kg</option>
            <option>g</option>
            <option>Liter</option>
            <option>ml</option>

        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="item">

            <div class="produkt">
                Milch
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-green">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

        <div class="item">

            <div class="produkt">
                Kaffee
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-red">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

    </div>

</div>

<script>

function toggleMenu(){

    document
    .getElementById("menu")
    .classList
    .toggle("show");

}

</body>
</html>
