<!DOCTYPE html>
<html lang="de">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Comfortaa:wght@700&family=Quicksand:wght@700&family=Red+Hat+Display:wght@800&family=Fredoka:wght@700&family=Manrope:wght@800&display=swap" rel="stylesheet">

<style>

body{
    background:#f4f6f8;

.comfortaa{

    </div>
</div>

<div class="beispiel">
    <div class="name">5. Fredoka</div>

        SmartShop V5
    </div>
</div>

<div class="beispiel">
    <div class="name">6. Manrope</div>
