<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Oswald:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{

    --green:#9BC45A;
    --darkgreen:#4C8A34;
    --bg:#f5f6f7;

    /* Später einstellbar 10-30 */

    --fontSize:18px;

    /* Verhältnis 30:18 */

    --rowHeight:calc(var(--fontSize) * 1.67);

    --buttonSize:var(--rowHeight);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:#000;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;
}

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:8px;
}

/* ========================= */
/* TITEL */
/* ========================= */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:8px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:58%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#000;

    font-size:22px;

    font-weight:700;

    letter-spacing:-2px;

    cursor:pointer;
}

/* ========================= */
/* NAVIGATION */
/* ========================= */

.menu{

    display:none;

    gap:2px;

    margin-bottom:8px;
}

.menu.show{

    display:flex;
}

.navBtn{

    flex:1;

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    text-align:center;

    padding:3px;
}

.navIcon{

    font-size:16px;

    line-height:1;
}

.navText{

    font-size:10px;

    font-weight:500;

    line-height:1;
}

/* ========================= */
/* EINGABEZEILE */
/* ========================= */

.inputRow{

    display:flex;

    gap:2px;

    margin-bottom:8px;
}

.inputRow input,
.inputRow select{

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;

    padding:0 4px;
}

/* PRODUKT */

#produkt{

    flex:1;

    min-width:50px;
}

/* 999 */

#menge{

    flex:0 0 auto;

    width:4ch;

    min-width:4ch;

    text-align:center;
}

/* STK. / LT. */

#einheit{

    flex:0 0 auto;

    width:5ch;

    min-width:5ch;
}

/* PLUS */

.addBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    flex:0 0 auto;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-family:'Oswald',sans-serif;

    font-size:20px;

    font-weight:500;

    cursor:pointer;
}

/* ========================= */
/* LISTE */
/* ========================= */

.card{

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    padding:6px;
}

.cardTitel{

    font-size:20px;

    font-weight:500;
}

/* LEERE LISTE */

.listContainer{

    min-height:30px;
}

/* ========================= */
/* NATEL FIRST */
/* ========================= */

@media(max-width:480px){

    :root{

        --fontSize:16px;
    }

    .logo{

        font-size:30px;
    }

    .navText{

        font-size:9px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="titleRow">

        <div class="logo">
            SmartShop V5
        </div>

        <button
        class="menu-btn"
        onclick="toggleMenu()">
            •••
        </button>

    </div>

    <div
    class="menu"
    id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Einstellungen</div>
        </div>

    </div>

    <div class="inputRow">

        <input
        id="produkt"
        placeholder="Produkt">

        <input
        id="menge"
        value="0">

        <select id="einheit">

            <option>Stk.</option>
            <option>kg</option>
            <option>g</option>
            <option>ml</option>
            <option>lt.</option>

        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="listContainer">

        </div>

    </div>

</div>

<script>

function toggleMenu(){
    document
        .getElementById("menu")
        .classList
        .toggle("show");
}

/* =========================
   BLOCK 2
========================= */

const produktInput = document.getElementById('produkt');
const mengeInput = document.getElementById('menge');
const einheitSelect = document.getElementById('einheit');
const addBtn = document.querySelector('.addBtn');
const listContainer = document.querySelector('.listContainer');

let produkte = [];

addBtn.addEventListener('click', produktHinzufuegen);

produktInput.addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
        produktHinzufuegen();
    }
});

mengeInput.addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
        produktHinzufuegen();
    }
});

function produktHinzufuegen(){

    let produkt = produktInput.value.trim();

    if(produkt.length === 0){
        alert("Bitte Produkt eingeben.");
        produktInput.focus();
        return;
    }

    if(produkt.length > 100){
        alert("Maximal 100 Zeichen erlaubt.");
        produktInput.focus();
        return;
    }

    produkt =
        produkt.charAt(0).toUpperCase() +
        produkt.slice(1).toLowerCase();

    let menge = parseInt(mengeInput.value);

    if(isNaN(menge) || menge < 1 || menge > 999){
        alert("Bitte Menge zwischen 1 und 999 eingeben.");
        mengeInput.focus();
        return;
    }

    const einheit = einheitSelect.value;

    const vorhanden = produkte.find(item =>
        item.product.toLowerCase() === produkt.toLowerCase() &&
        item.unit === einheit
    );

    if(vorhanden){

        const aktion = confirm(
            produkt +
            " existiert bereits.\n\n" +
            "OK = Zusammenführen\n" +
            "Abbrechen = Neues Produkt"
        );

        if(aktion){

            vorhanden.quantity =
                Math.min(
                    999,
                    vorhanden.quantity + menge
                );

            renderListe();

            produktInput.value = "";
            mengeInput.value = 1;
            einheitSelect.value = "Stk.";
            produktInput.focus();

            return;
        }
    }

    produkte.unshift({
        id: Date.now(),
        product: produkt,
        quantity: menge,
        unit: einheit,
        checked: false,
        actionFound: false,
        createdAt: Date.now()
    });

    renderListe();

    produktInput.value = "";
    mengeInput.value = 1;
    einheitSelect.value = "Stk.";

    produktInput.focus();
}

function renderListe(){

    listContainer.innerHTML = "";

    produkte.forEach(item => {

        const row = document.createElement("div");

        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.gap = "4px";
        row.style.marginTop = "4px";
        row.style.padding = "4px";
        row.style.borderBottom = "1px solid #ddd";

        row.innerHTML = `
            <div style="flex:1;overflow:hidden;text-overflow:ellipsis;">
                ${item.product}
            </div>

            <div style="width:45px;text-align:center;">
                ${item.quantity}
            </div>

            <div style="width:45px;text-align:center;">
                ${item.unit}
            </div>

            <div style="width:30px;text-align:center;">
                🔥
            </div>

            <div style="width:30px;text-align:center;">
                ✓
            </div>
        `;

        let startX = 0;

        row.addEventListener('touchstart', e=>{
            startX = e.changedTouches[0].clientX;
        });

        row.addEventListener('touchend', e=>{

            const endX =
                e.changedTouches[0].clientX;

            if(startX - endX > 80){

                const loeschen =
                    confirm(
                        item.product +
                        " löschen?"
                    );

                if(loeschen){

                    produkte =
                        produkte.filter(
                            p => p.id !== item.id
                        );

                    renderListe();
                }
            }
        });

        row.addEventListener('click', function(){

            const neuerName =
                prompt(
                    "Produkt bearbeiten:",
                    item.product
                );

            if(neuerName === null) return;

            const neueMenge =
                prompt(
                    "Menge bearbeiten:",
                    item.quantity
                );

            if(neueMenge === null) return;

            item.product =
                neuerName.trim();

            item.quantity =
                Math.min(
                    999,
                    parseInt(neueMenge) || 1
                );

            renderListe();
        });

        listContainer.appendChild(row);
    });
}

mengeInput.value = 1;

</script>
</body>
</html>
