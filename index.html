<!-- BLOCK 1 FINAL -->
<!-- SMARTSHOP V5.1.4 -->

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Oswald:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{

    --green:#9BC45A;
    --darkgreen:#4C8A34;
    --bg:#f5f6f7;

    /* Benutzer später 10-30px */

    --fontSize:18px;

    /* Verhältnis 30 : 18 */

    --rowHeight:calc(var(--fontSize) * 1.67);

    --buttonSize:var(--rowHeight);
}

/* ===================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    color:#000;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;
}

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:8px;
}

/* ===================================== */
/* TITEL */
/* ===================================== */

.titleRow{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:8px;
}

.logo{

    font-family:'Quicksand',sans-serif;

    font-size:34px;

    color:var(--green);

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu-btn{

    position:absolute;

    right:0;

    top:58%;

    transform:translateY(-50%);

    background:none;

    border:none;

    color:black;

    font-size:22px;

    font-weight:700;

    letter-spacing:-2px;

    cursor:pointer;
}

/* ===================================== */
/* NAVIGATION */
/* ===================================== */

.menu{

    display:none;

    gap:4px;

    margin-bottom:10px;
}

.menu.show{

    display:flex;
}

.navBtn{

    flex:1;

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    padding:3px;

    text-align:center;
}

.navIcon{

    font-size:18px;

    line-height:1;
}

.navText{

    font-size:12px;

    font-weight:500;

    line-height:1;
}

/* ===================================== */
/* EINGABE */
/* ===================================== */

.inputRow{

    display:flex;

    gap:4px;

    margin-bottom:10px;
}

.inputRow input,
.inputRow select{

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    font-family:'Oswald',sans-serif;

    font-size:var(--fontSize);

    font-weight:400;

    line-height:1;

    padding:0 6px;
}

/* PRODUKT */

#produkt{

    flex:1;

    min-width:80px;
}

/* 999 */

#menge{

    min-width:4ch;

    width:4ch;

    text-align:center;

    flex-shrink:0;
}

/* LITER + PFEIL */

#einheit{

    min-width:8ch;

    width:8ch;

    flex-shrink:0;
}

/* QUADRAT */

.addBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    flex-shrink:0;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-family:'Oswald',sans-serif;

    font-size:calc(var(--fontSize) + 2px);

    font-weight:500;

    cursor:pointer;
}

/* ===================================== */
/* KARTE */
/* ===================================== */

.card{

    background:white;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    padding:6px;
}

.cardTitel{

    font-size:calc(var(--fontSize) + 2px);

    font-weight:500;

    margin-bottom:8px;
}

/* ===================================== */
/* PRODUKTE */
/* ===================================== */

.item{

    display:flex;

    gap:4px;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    min-width:80px;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    padding:0 8px;

    background:white;

    font-size:var(--fontSize);

    font-weight:400;

    line-height:1;
}

/* 999 */

.menge{

    width:4ch;

    min-width:4ch;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-weight:400;
}

/* LITER */

.einheit{

    width:8ch;

    min-width:8ch;

    height:var(--rowHeight);

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    font-weight:400;
}

/* FEUER */

.actionBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    border:none;

    border-radius:4px;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.action-green{

    background:#43a047;
}

.action-red{

    background:#d84315;
}

/* HAKEN */

.doneBtn{

    width:var(--buttonSize);

    height:var(--buttonSize);

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:18px;

    font-weight:500;

    cursor:pointer;
}

</style>

<div class="container">

    <div class="titleRow">

        <div class="logo">
            SmartShop V5
        </div>

        <button
            class="menu-btn"
            onclick="toggleMenu()">
            •••
        </button>

    </div>

    <div class="menu" id="menu">

        <div class="navBtn">
            <div class="navIcon">🛒</div>
            <div class="navText">Liste</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⭐</div>
            <div class="navText">Favoriten</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">💡</div>
            <div class="navText">Ideen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">🔥</div>
            <div class="navText">Aktionen</div>
        </div>

        <div class="navBtn">
            <div class="navIcon">⚙️</div>
            <div class="navText">Settings</div>
        </div>

    </div>

    <div class="inputRow">

        <input
            id="produkt"
            placeholder="Produkt">

        <input
            id="menge"
            value="0">

        <select id="einheit">

            <option>Stk</option>
            <option>kg</option>
            <option>g</option>
            <option>ml</option>
            <option>Liter</option>

        </select>

        <button class="addBtn">
            +
        </button>

    </div>

    <div class="card">

        <div class="cardTitel">
            🛒 Einkaufsliste
        </div>

        <div class="item">

            <div class="produkt">
                Milch
            </div>

            <div class="menge">
                1
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-green">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

        <div class="item">

            <div class="produkt">
                Kaffee
            </div>

            <div class="menge">
                2
            </div>

            <div class="einheit">
                Stk
            </div>

            <button class="actionBtn action-red">
                🔥
            </button>

            <button class="doneBtn">
                ✓
            </button>

        </div>

    </div>

</div>

<script>

function toggleMenu(){

    document
        .getElementById("menu")
        .classList
        .toggle("show");
}

</script>
