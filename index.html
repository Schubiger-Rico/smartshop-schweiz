<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop V5</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

<style>

:root{
    --green:#78b84d;
    --darkgreen:#2f6d1d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f6f8;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
}

.menu-btn{

    width:34px;
    height:34px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;
}

.logo{

    text-align:center;

    font-family:'Quicksand',sans-serif;

    font-size:36px;

    color:var(--green);

    letter-spacing:1px;

    margin:10px 0 20px;

    text-shadow:
    -1px 0 #000,
     1px 0 #000,
     0 -1px #000,
     0 1px #000;
}

.menu{

    display:none;

    gap:6px;

    margin-bottom:15px;

    justify-content:center;

    flex-wrap:wrap;
}

.menu.show{
    display:flex;
}

.navBtn{

    width:70px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    padding:4px;
}

.navIcon{
    font-size:18px;
}

.navText{
    font-size:12px;
    font-weight:600;
}

.inputRow{

    display:flex;

    gap:4px;

    margin-bottom:10px;
}

.inputRow input,
.inputRow select{

    height:40px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    padding:0 8px;

    font-size:16px;

    font-weight:600;
}

#produkt{
    flex:1;
}

#menge{
    width:60px;
    text-align:center;
}

#einheit{
    width:80px;
}

.addBtn{

    width:40px;

    height:40px;

    border:none;

    border-radius:4px;

    background:var(--green);

    color:white;

    font-size:24px;

    font-weight:700;
}

.card{

    border:2px solid var(--darkgreen);

    border-radius:4px;

    background:white;

    padding:8px;
}

.cardTitel{

    font-size:18px;

    font-weight:700;

    margin-bottom:8px;
}

.item{

    display:flex;

    align-items:center;

    gap:4px;

    margin-bottom:4px;
}

.produkt{

    flex:1;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    height:32px;

    display:flex;

    align-items:center;

    padding:0 8px;

    font-weight:600;

    background:white;
}

.menge,
.einheit{

    width:45px;

    height:32px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:600;

    background:white;
}

.einheit{
    width:55px;
}

.actionBtn,
.doneBtn,
.status{

    width:32px;

    height:32px;

    border:2px solid var(--darkgreen);

    border-radius:4px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:600;

    background:white;

    cursor:pointer;
}

.status.green{
    background:#43a047;
}

.status.red{
    background:#e53935;
}

</style>
</head>
<body>

<div class="container">

<div class="topbar">
<button class="menu-btn" onclick="toggleMenu()">⋮</button>
</div>

<div class="logo">
SmartShop V5
</div>

<div class="menu" id="menu">

<div class="navBtn">
<div class="navIcon">🛒</div>
<div class="navText">Liste</div>
</div>

<div class="navBtn">
<div class="navIcon">⭐</div>
<div class="navText">Favoriten</div>
</div>

<div class="navBtn">
<div class="navIcon">💡</div>
<div class="navText">Ideen</div>
</div>

<div class="navBtn">
<div class="navIcon">🔥</div>
<div class="navText">Aktionen</div>
</div>

<div class="navBtn">
<div class="navIcon">⚙️</div>
<div class="navText">Settings</div>
</div>

</div>

<div class="inputRow">

<input
id="produkt"
placeholder="Produkt">

<input
id="menge"
value="1">

<select id="einheit">
<option>Stk</option>
<option>kg</option>
<option>g</option>
<option>Liter</option>
<option>ml</option>
</select>

<button class="addBtn">+</button>

</div>

<div class="card">

<div class="cardTitel">
🛒 Einkaufsliste
</div>

<div class="item">

<div class="produkt">
Milch
</div>

<div class="menge">
1
</div>

<div class="einheit">
Stk
</div>

<div class="actionBtn">
🔥
</div>

<div class="status green">
</div>

<div class="doneBtn">
✓
</div>

</div>

<div class="item">

<div class="produkt">
Kaffee
</div>

<div class="menge">
1
</div>

<div class="einheit">
Stk
</div>

<div class="actionBtn">
🔥
</div>

<div class="status red">
</div>

<div class="doneBtn">
✓
</div>

</div>

</div>

</div>

<script>

function toggleMenu(){

    document
    .getElementById("menu")
    .classList
    .toggle("show");
}

</script>

</body>
</html>
