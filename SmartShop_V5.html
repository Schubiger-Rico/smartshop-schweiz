<script>

let liste =
JSON.parse(localStorage.getItem("liste")) || [];

let favoriten =
JSON.parse(localStorage.getItem("favoriten")) || [];

let verlauf =
JSON.parse(localStorage.getItem("verlauf")) || [];

function speichern(){

localStorage.setItem(
"liste",
JSON.stringify(liste)
);

localStorage.setItem(
"favoriten",
JSON.stringify(favoriten)
);

localStorage.setItem(
"verlauf",
JSON.stringify(verlauf)
);

}

function anzeigen(){

let listeDiv =
document.getElementById("liste");

listeDiv.innerHTML = "";

liste.forEach(function(eintrag,index){

listeDiv.innerHTML +=
`
<div class="item">
☐ ${eintrag}
</div>
`;

});

anzeigenFavoriten();
anzeigenVerlauf();

}

function addProdukt(){

let produkt =
document.getElementById("produkt")
.value.trim();

let menge =
document.getElementById("menge")
.value;

let einheit =
document.getElementById("einheit")
.value;

if(produkt === ""){
return;
}

let text = produkt;

if(einheit !== "Einheit"){

text =
produkt +
" (" +
menge +
" " +
einheit +
")";

}

liste.push(text);

verlauf.unshift(text);

if(verlauf.length > 30){

verlauf.pop();

}

document.getElementById("produkt")
.value = "";

speichern();

anzeigen();

}

function anzeigenFavoriten(){

let div =
document.getElementById("favoriten");

div.innerHTML = "";

favoriten.forEach(function(item){

div.innerHTML +=
`
<div class="item">
${item}
</div>
`;

});

}

function anzeigenVerlauf(){

let div =
document.getElementById("verlauf");

div.innerHTML = "";

verlauf.forEach(function(item){

div.innerHTML +=
`
<div class="item">
${item}
</div>
`;

});

}

document
.getElementById("addBtn")
.addEventListener(
"click",
addProdukt
);

anzeigen();

 /* =========================

const darkMode =
document.getElementById("darkMode");

if(localStorage.getItem("darkMode")==="true"){

document.body.classList.add("dark");
darkMode.checked = true;

}

darkMode.addEventListener("change",function(){

if(this.checked){

document.body.classList.add("dark");
localStorage.setItem("darkMode","true");

}else{

document.body.classList.remove("dark");
localStorage.setItem("darkMode","false");

}

});


/* =========================
   SCHRIFTFARBE
========================= */

const farbe =
document.getElementById("farbe");

if(localStorage.getItem("schriftfarbe")){

document.documentElement.style
.setProperty(
"--text",
localStorage.getItem("schriftfarbe")
);

farbe.value =
localStorage.getItem("schriftfarbe");

}

farbe.addEventListener("change",function(){

document.documentElement.style
.setProperty(
"--text",
this.value
);

localStorage.setItem(
"schriftfarbe",
this.value
);

});
